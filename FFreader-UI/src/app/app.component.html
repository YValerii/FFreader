<header class="app-bar">
  <div class="app-bar__inner">
    <div class="brand">
      <span class="brand__mark"><mat-icon aria-hidden="true">auto_stories</mat-icon></span>
      <span class="brand__name">FFreader</span>
    </div>
    <button matIconButton type="button"
            [matTooltip]="nextThemeLabel()"
            [attr.aria-label]="nextThemeLabel()"
            (click)="toggleTheme()">
      <mat-icon aria-hidden="true">{{ themeIcon() }}</mat-icon>
    </button>
  </div>
</header>

<main class="page">
  <section class="intro">
    <h1>Your library</h1>
    <p>Paste a fanfiction.net link and get the whole story as one clean, readable PDF.</p>
    <app-add-fanfic-form />
  </section>

  <app-fanfic-list
    [fanfics]="store.fanfics()"
    [totalElements]="store.totalElements()"
    [pageIndex]="store.pageIndex()"
    [pageSize]="store.pageSize()"
    [loading]="store.loading()"
    [failed]="store.failed()"
    (pageChange)="onPageChange($event)"
    (retry)="store.refresh()"
    (download)="onDownload($event)"
    (delete)="onDelete($event)" />
</main>
