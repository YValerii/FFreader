version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: ffreader-postgres
    environment:
      POSTGRES_DB: ffreader
      POSTGRES_USER: ffreader
      POSTGRES_PASSWORD: ffreader
    ports:
      - "5432:5432"
    volumes:
      - ffreader_pgdata:/var/lib/postgresql/data

volumes:
  ffreader_pgdata:
