spring:
  application:
    name: FFreader-API

  datasource:
    url: jdbc:postgresql://localhost:5432/ffreader
    username: ffreader
    password: ffreader
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

ffreader:
  scraper:
    headless: true
    page-load-timeout-seconds: 120
    pool-size: 10
  storage:
    extraction-dir: /tmp/ffreader/extractions
    pdf-dir: /tmp/ffreader/pdfs
  cors:
    allowed-origins: http://localhost:4200

logging:
  level:
    com.ffreader: INFO
    org.openqa.selenium: WARN
